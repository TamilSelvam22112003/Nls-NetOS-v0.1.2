name: custom-router
on:
  push:
    paths: ['custom-router/**']
  pull_request:
    paths: ['custom-router/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
