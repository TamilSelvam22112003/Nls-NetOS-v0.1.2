[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nls-netos"
version = "0.1.2"
description = "Network Layer Security router operating system components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0", "PyYAML>=6.0", "scapy>=2.5", "psutil>=5.9", "pyroute2>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "build>=1.2", "pre-commit>=3.7"]

[tool.setuptools]
package-dir = {"" = "usr/lib"}

[tool.setuptools.packages.find]
where = ["usr/lib"]
include = ["nls*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
